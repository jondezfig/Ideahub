<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IdeaHub</title>
<style>
:root{--bg:#f7f7f7;--card:#fff;--tx:#111;--mu:#6b6b6b;--bd:#e5e5e5;--or:#ee4408}
@media(prefers-color-scheme:dark){:root{--bg:#0c0c0c;--card:#161616;--tx:#f2f2f2;--mu:#9a9a9a;--bd:#2a2a2a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #2563ff99}100%{box-shadow:0 0 0 10px #2563ff00}}
header{position:sticky;top:10px;z-index:5;margin:10px 12px;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 18px;border-radius:99px;background:#111;color:#fff;box-shadow:0 8px 30px #0003}
.logo{font-weight:800;cursor:pointer;white-space:nowrap}nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
nav button{border:0;background:none;color:#bbb;padding:8px 12px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}nav button.on{background:#fff;color:#111}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;animation:up .4s both}
.row{display:flex;gap:10px;align-items:center}.sp{flex:1}.mu{color:var(--mu);font-size:13px}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;object-fit:cover;background:#555}
input,textarea,select{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:10px 12px;font:inherit;margin-bottom:8px}
textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:99px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:var(--or)}.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn:active{transform:scale(.95)}
.cta{width:100%;padding:15px;font-size:17px;margin:8px 0}
h1.big{font-size:clamp(34px,9vw,60px);line-height:1.03;letter-spacing:-.035em;margin:10px 0}h3{margin:2px 0 6px}
.tag{background:var(--bg);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600}
.pic{max-width:100%;max-height:340px;border-radius:12px;margin-top:8px;display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}.chip.on{background:var(--tx);color:var(--bg)}
.msgs{height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}.m{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--bg);word-wrap:break-word}.m.me{align-self:flex-end;background:var(--or);color:#fff}.m b{display:block;font-size:11px;opacity:.75}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2563ff;animation:pulse 1.6s infinite;margin-right:6px}
.bar{height:8px;border-radius:99px;background:var(--or)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:99px;z-index:60}
.center{text-align:center;padding:40px 0}
</style></head><body>
<header id="hd"><span class="logo" data-tab="feed">💡 <span id="app"></span></span></header>
<main id="main"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://ghamjcltjcvxhrnkfhvl.supabase.co',SB_KEY='sb_publishable_f5YstFQIchLU2KTV_BGKtg_lrFuO85l',APP='IdeaHub';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.title=APP;$('#app').textContent=APP;
const CITIES="London,51.5,-0.1;Paris,48.9,2.4;Berlin,52.5,13.4;Madrid,40.4,-3.7;Rome,41.9,12.5;Amsterdam,52.4,4.9;Istanbul,41,29;Moscow,55.8,37.6;Dubai,25.2,55.3;Cairo,30,31.2;Lagos,6.5,3.4;Nairobi,-1.3,36.8;Johannesburg,-26.2,28;Accra,5.6,-0.2;Mumbai,19.1,72.9;Delhi,28.6,77.2;Bengaluru,13,77.6;Dhaka,23.8,90.4;Bangkok,13.8,100.5;Singapore,1.35,103.8;Jakarta,-6.2,106.8;Hong Kong,22.3,114.2;Shanghai,31.2,121.5;Tokyo,35.7,139.7;Seoul,37.6,127;Sydney,-33.9,151.2;Auckland,-36.8,174.8;New York,40.7,-74;Toronto,43.7,-79.4;Chicago,41.9,-87.6;Los Angeles,34,-118.2;San Francisco,37.8,-122.4;Mexico City,19.4,-99.1;Bogota,4.7,-74.1;Sao Paulo,-23.5,-46.6;Buenos Aires,-34.6,-58.4".split(';').map(x=>{const a=x.split(',');return[a[0],+a[1],+a[2]]});
const sb=SB_URL.startsWith('YOUR_')?null:supabase.createClient(SB_URL,SB_KEY);
let me,prof,tab='feed',posts=[],people={},fr=[],room='community',msgs=[],q='',pend={},openC={},online={},started='',chans=[],map=null;
const nm=p=>p?(p.username?'@'+p.username:p.full_name||'Someone'):'Someone';
const av=p=>p&&p.avatar_url?`<img class="av" src="${esc(p.avatar_url)}" alt="">`:`<div class="av">${esc((nm(p)[1]||nm(p)[0]||'?').toUpperCase())}</div>`;
const ago=t=>{const s=(Date.now()-new Date(t))/1000;return s<10?'just now':s<60?Math.floor(s)+'s ago':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const tm=t=>`<span data-ts="${t}" title="${new Date(t).toLocaleString()}">${ago(t)}</span>`;
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)};
const att=u=>u?`<img class="pic" src="${esc(u)}" loading="lazy" alt="">`:'';
const dmRoom=id=>'dm_'+[me.id,id].sort().join('_');
const friends=()=>fr.filter(f=>f.status==='accepted').map(f=>f.a===me.id?f.b:f.a);

/* ---------- boot & auth ---------- */
async function boot(){
  if(!sb){$('#main').innerHTML='<div class="card">Open <b>index.html</b> and paste your Supabase URL and anon key at the top of the script (see README).</div>';return}
  sb.auth.onAuthStateChange((_e,s)=>{const id=s&&s.user?s.user.id:'';if(id!==started)start(s)});
  const{data:{session}}=await sb.auth.getSession();if((session?session.user.id:'')!==started)start(session);
}
function loginView(){
  $('#hd').innerHTML=`<span class="logo">💡 ${esc(APP)}</span>`;
  $('#main').innerHTML=`<div class="center"><h1 class="big">Where good ideas find their people.</h1><p class="mu" style="font-size:17px">Share ideas, chat with people worldwide and make friends. Free.</p>
  <button class="btn cta" data-act="google">Continue with Google</button><div class="mu" style="margin:10px 0">or use your email</div>
  <input id="em" type="email" placeholder="you@email.com"><button class="btn g cta" data-act="magic">Email me a sign-in link</button><div class="mu" style="margin-top:16px"><span class="dot"></span><b id="lcl">0</b> people here right now</div></div>`;
}
async function start(session){
  closeChans();me=session&&session.user;started=me?me.id:'';
  if(!me){loginView();goLive((crypto.randomUUID?crypto.randomUUID():String(Math.random())),'Visitor');return}
  let r;for(let i=0;i<5&&!(r=(await sb.from('profiles').select('*').eq('id',me.id).maybeSingle()).data);i++)await new Promise(k=>setTimeout(k,500));
  prof=r;if(!prof){$('#main').innerHTML='<div class="card">Profile setup failed. Did you run schema.sql?</div>';return}
  if(!prof.username)return claimView();
  await Promise.all([loadPeople(),loadPosts(),loadFr()]);shell();subscribe();goLive(me.id,nm(prof));
}
function claimView(){
  $('#hd').innerHTML=`<span class="logo">💡 ${esc(APP)}</span><button class="btn g" style="margin-left:auto" data-act="out">Sign out</button>`;
  $('#main').innerHTML=`<div class="center"><h1 class="big">Pick your username</h1><p class="mu">Unique to you. Nobody else can take it.</p><input id="un" placeholder="e.g. idea_wizard" maxlength="20"><button class="btn cta" data-act="claim">Join →</button></div>`;
}

/* ---------- data ---------- */
const PJ='profiles(username,full_name,avatar_url)';
async function loadPeople(){const{data}=await sb.from('profiles').select('*').not('username','is',null).limit(500);people={};(data||[]).forEach(p=>people[p.id]=p)}
async function loadPosts(){const{data}=await sb.from('posts').select(`*,${PJ},likes(user_id),comments(id,body,created_at,user_id,${PJ})`).order('created_at',{ascending:false}).limit(60);posts=data||[];if(tab==='feed')paintFeed()}
async function loadFr(){const{data}=await sb.from('friendships').select('*');fr=data||[];if(tab==='people')paintPeople();if(tab==='chat')shellChat()}
async function loadMsgs(){const{data}=await sb.from('messages').select(`*,${PJ}`).eq('room',room).order('created_at',{ascending:false}).limit(100);msgs=(data||[]).reverse();paintMsgs()}
function closeChans(){chans.forEach(c=>sb.removeChannel(c));chans=[]}
function subscribe(){
  const d=(t,f)=>sb.channel('db_'+t).on('postgres_changes',{event:'*',schema:'public',table:t},f).subscribe();
  chans.push(d('posts',loadPosts),d('comments',loadPosts),d('likes',loadPosts),d('friendships',loadFr));
  chanMsgs();
}
let mch=null;
function chanMsgs(){if(mch)sb.removeChannel(mch);mch=sb.channel('msg_'+room).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room=eq.'+room},p=>{const m=p.new;m.profiles=people[m.user_id]||null;msgs.push(m);if(tab==='chat')paintMsgs()}).subscribe()}
let geo=null,spin=false,mapReady=false,pulseT=0;
const tzCity=()=>{const z=(Intl.DateTimeFormat().resolvedOptions().timeZone||'').split('/'),n=(z[z.length-1]||'').replace(/_/g,' ');return CITIES.find(x=>x[0].toLowerCase()===n.toLowerCase())||[n||'Somewhere',20,0]};
async function locate(){
  const c=CITIES.find(x=>prof&&x[0]===prof.city);if(c)return{place:c[0],lat:c[1],lng:c[2]};
  if(geo)return geo;
  try{const j=await(await fetch('https://get.geojs.io/v1/ip/geo.json')).json();if(j.latitude)return geo={place:j.city||j.region||j.country||'Somewhere',lat:+j.latitude,lng:+j.longitude}}catch(e){}
  const t=tzCity();return geo={place:t[0],lat:t[1],lng:t[2]}}
function goLive(key,name){const ch=sb.channel('online',{config:{presence:{key}}});
  ch.on('presence',{event:'sync'},()=>{online=ch.presenceState();const n=Object.keys(online).length;['#lc','#lcl'].forEach(i=>$(i)&&($(i).textContent=n));if(tab==='live'&&me)paintLive()})
   .subscribe(async s=>{if(s==='SUBSCRIBED'){const g=await locate();await ch.track({name,place:g.place,lat:g.lat,lng:g.lng})}});chans.push(ch)}

/* ---------- views ---------- */
const TABS=[['feed','Ideas'],['people','People'],['chat','Chat'],['live','Live'],['me','Profile']];
function shell(){
  $('#hd').innerHTML=`<span class="logo" data-tab="feed">💡 ${esc(APP)}</span><nav>${TABS.map(([k,l])=>`<button data-tab="${k}">${l}${k==='live'?' (<span id="lc">'+Object.keys(online).length+'</span>)':''}</button>`).join('')}</nav>`;
  setTab(tab);
}
function setTab(t){if(map&&t!=='live'){map.remove();map=null;mapReady=false;spin=false}tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));scrollTo(0,0);
  ({feed:vFeed,people:vPeople,chat:vChat,live:vLive,me:vMe})[t]()}
function vFeed(){$('#main').innerHTML=`<div class="card"><input id="pt" placeholder="Idea title" maxlength="120"><textarea id="px" placeholder="Describe your idea…" maxlength="2000"></textarea><input id="pg" placeholder="Tag (e.g. tech, art)" maxlength="24"><div class="row"><label class="btn g" style="cursor:pointer">📷 Image<input type="file" id="pf" accept="image/*" hidden></label><span class="mu" id="pn"></span><span class="sp"></span><button class="btn" data-act="post">Share idea</button></div></div><input id="sq" placeholder="🔍 Search ideas" value="${esc(q)}"><div id="list"></div>`;paintFeed()}
function paintFeed(){const l=$('#list');if(!l)return;const f=posts.filter(p=>!q||(p.title+p.body+(p.tag||'')).toLowerCase().includes(q.toLowerCase()));
  l.innerHTML=f.map(p=>{const lk=p.likes.some(x=>x.user_id===me.id);return `<div class="card"><div class="row">${av(p.profiles)}<div><b>${esc(nm(p.profiles))}</b><div class="mu">${tm(p.created_at)}</div></div></div><h3>${esc(p.title)}</h3><div>${esc(p.body)}</div>${att(p.image_url)}<div class="row" style="margin-top:8px">${p.tag?`<span class="tag">#${esc(p.tag)}</span>`:''}<span class="sp"></span><button class="btn g" data-act="like" data-id="${p.id}">${lk?'❤️':'🤍'} ${p.likes.length}</button><button class="btn g" data-act="oc" data-id="${p.id}">💬 ${p.comments.length}</button>${p.user_id===me.id?`<button class="btn g" data-act="del" data-id="${p.id}">🗑</button>`:''}</div>${openC[p.id]?cmts(p):''}</div>`}).join('')||'<p class="mu">No ideas yet. Be the first!</p>'}
const cmts=p=>`<div style="margin-top:8px">${p.comments.sort((a,b)=>a.created_at<b.created_at?-1:1).map(c=>`<div class="row" style="border-top:1px solid var(--bd);padding:8px 0">${av(c.profiles)}<div><b>${esc(nm(c.profiles))}</b> <span class="mu">${tm(c.created_at)}</span><div>${esc(c.body)}</div></div></div>`).join('')}<div class="row"><input id="ci${p.id}" placeholder="Write a comment…" style="margin:0" maxlength="500"><button class="btn" data-act="cmt" data-id="${p.id}">Post</button></div></div>`;
function vPeople(){$('#main').innerHTML=`<input id="sq" placeholder="🔍 Search people" value="${esc(q)}"><div id="plist"></div>`;paintPeople()}
function paintPeople(){const l=$('#plist');if(!l)return;
  l.innerHTML=Object.values(people).filter(p=>p.id!==me.id&&(!q||(nm(p)+p.full_name+(p.bio||'')).toLowerCase().includes(q.toLowerCase()))).map(p=>{const f=fr.find(x=>(x.a===me.id&&x.b===p.id)||(x.b===me.id&&x.a===p.id));
    const b=!f?`<button class="btn" data-act="add" data-id="${p.id}">Add friend</button>`:f.status==='accepted'?`<button class="btn g" data-act="dm" data-id="${p.id}">Message</button>`:f.a===me.id?'<span class="mu">Request sent</span>':`<button class="btn" data-act="acc" data-id="${p.id}">Accept</button>`;
    return `<div class="card row">${av(p)}<div class="sp"><b>${esc(nm(p))}</b><div class="mu">${esc([p.role,p.city].filter(Boolean).join(' · '))}</div><div class="mu">${esc(p.bio||'')}</div></div>${b}</div>`}).join('')||'<p class="mu">No one else yet. Invite friends!</p>'}
function vChat(){shellChat()}
function shellChat(){if(tab!=='chat')return;const ch=[['community','🌍 Community'],...friends().map(i=>[dmRoom(i),'💬 '+nm(people[i])])];
  $('#main').innerHTML=`<div class="chips">${ch.map(([k,l])=>`<span class="chip ${room===k?'on':''}" data-room="${esc(k)}">${esc(l)}</span>`).join('')}</div><div class="card"><div class="msgs" id="msgs"></div><div class="row" style="margin-top:8px"><label class="btn g" style="cursor:pointer">📷<input type="file" id="cf" accept="image/*" hidden></label><input id="mi" placeholder="Type a message…" style="margin:0" maxlength="1000"><button class="btn" data-act="send">Send</button></div><div class="mu" id="cn"></div></div>`;loadMsgs()}
function paintMsgs(){const b=$('#msgs');if(!b)return;b.innerHTML=msgs.map(m=>`<div class="m ${m.user_id===me.id?'me':''}"><b>${esc(nm(m.profiles||people[m.user_id]))}</b>${esc(m.body)}${att(m.image_url)}<span style="display:block;font-size:10px;opacity:.7">${tm(m.created_at)}</span></div>`).join('')||'<p class="mu">No messages yet. Say hi 👋</p>';b.scrollTop=b.scrollHeight}
function vLive(){$('#main').innerHTML=`<div class="center" style="padding:10px 0"><h1 class="big" style="font-size:clamp(30px,8vw,52px)">Who's online right now?</h1><div id="lv"></div></div><div style="position:relative"><div id="map" style="height:min(68vh,560px);border-radius:16px;overflow:hidden;background:#cfe8ff"></div><button class="btn g" data-act="spin" style="position:absolute;left:10px;top:10px">🔄 Auto-rotate</button></div><div class="mu" style="margin-top:6px">Drag to spin the globe, pinch or scroll to zoom, two fingers or right-click drag to rotate and tilt. Locations are approximate, city level only.</div><div class="card" id="lb" style="margin-top:12px"></div>`;initMap();paintLive()}
function feats(){const ps=Object.values(online).map(x=>x[0]),mem={},g={},f=[];
  Object.values(people).forEach(p=>{if(p.city)mem[p.city]=(mem[p.city]||0)+1});
  ps.forEach(p=>{const k=p.place;g[k]=g[k]||{n:0,lat:p.lat,lng:p.lng};g[k].n++});
  Object.entries(mem).forEach(([k,n])=>{const c=CITIES.find(z=>z[0]===k);if(c)f.push({type:'Feature',properties:{kind:'mem',n,name:k},geometry:{type:'Point',coordinates:[c[2],c[1]]}})});
  Object.entries(g).forEach(([k,v])=>f.push({type:'Feature',properties:{kind:'on',n:v.n,name:k},geometry:{type:'Point',coordinates:[v.lng,v.lat]}}));
  return{ps,mem,on:Object.fromEntries(Object.entries(g).map(([k,v])=>[k,v.n])),fc:{type:'FeatureCollection',features:f}}}
function paintLive(){const v=$('#lv');if(!v)return;const{ps,mem,on,fc}=feats();
  v.innerHTML=`<span class="dot"></span><b>${ps.length}</b> here now · <b>${Object.keys(people).length}</b> members`;
  const keys=[...new Set([...Object.keys(mem),...Object.keys(on)])],tot=k=>(mem[k]||0)+(on[k]||0);keys.sort((a,b)=>tot(b)-tot(a));
  $('#lb').innerHTML='<h3>Leaderboard</h3>'+(keys.map((k,i)=>`<div style="margin:10px 0"><div class="row"><span class="mu">${i+1}</span><b class="sp">${esc(k)} ${on[k]?'<span class="dot"></span>':''}</b><b>${tot(k)}</b></div><div class="bar" style="width:${Math.max(4,tot(k)/tot(keys[0])*100)}%"></div></div>`).join('')||'<p class="mu">Waiting for people…</p>');
  if(map&&mapReady)map.getSource('pts').setData(fc)}
const ld=src=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
async function initMap(){mapReady=false;
  try{if(!window.maplibregl){const l=document.createElement('link');l.rel='stylesheet';l.href='https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css';document.head.appendChild(l);await ld('https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js')}
  if(tab!=='live')return;
  map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[15,30],zoom:1.5,maxPitch:85});
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
  map.on('style.load',()=>{try{map.setProjection({type:'globe'})}catch(e){}});
  map.on('load',()=>{const sz=['min',22,['+',7,['*',2.5,['get','n']]]];
    map.addSource('pts',{type:'geojson',data:feats().fc});
    map.addLayer({id:'mem',type:'circle',source:'pts',filter:['==',['get','kind'],'mem'],paint:{'circle-radius':sz,'circle-color':'#ee5a24','circle-stroke-color':'#fff','circle-stroke-width':2,'circle-opacity':.95}});
    map.addLayer({id:'halo',type:'circle',source:'pts',filter:['==',['get','kind'],'on'],paint:{'circle-radius':14,'circle-color':'#2563ff','circle-opacity':.4}});
    map.addLayer({id:'on',type:'circle',source:'pts',filter:['==',['get','kind'],'on'],paint:{'circle-radius':sz,'circle-color':'#2563ff','circle-stroke-color':'#fff','circle-stroke-width':2}});
    ['mem','on'].forEach(l=>{map.on('click',l,e=>{const p=e.features[0].properties;new maplibregl.Popup().setLngLat(e.features[0].geometry.coordinates).setHTML('<b>'+esc(p.name)+'</b><br>'+p.n+(l==='on'?' online now':' members')).addTo(map)});map.on('mouseenter',l,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',l,()=>map.getCanvas().style.cursor='')});
    mapReady=true;const my=++pulseT;const loop=t=>{if(!map||my!==pulseT)return;const ph=(t/1500)%1;try{map.setPaintProperty('halo','circle-radius',12+ph*30);map.setPaintProperty('halo','circle-opacity',.5*(1-ph))}catch(e){}requestAnimationFrame(loop)};requestAnimationFrame(loop);paintLive()});
  map.on('moveend',()=>{if(spin)spinStep()});
  }catch(e){const m=$('#map');if(m)m.innerHTML='<p class="mu" style="padding:16px">Map could not load.</p>'}}
function spinStep(){if(!map)return;const c=map.getCenter();map.easeTo({center:[c.lng-45,Math.max(-40,Math.min(50,c.lat))],duration:3500,easing:t=>t})}
function vMe(){const p=prof,link=location.origin+location.pathname;$('#main').innerHTML=`<div class="card"><div class="row">${av(p)}<div><b>${esc(nm(p))}</b><div class="mu
